
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration - MESSCARD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>MESSCARD</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="registration.html">Student Login</a>
            <a href="staff.html">Staff Login</a>
            <a href="admin.html">Admin Login</a>
        </nav>
    </header>

    <section>
        <h2>Student Registration</h2>
        <p>Register for your mess account.</p>

        <form>
            <label>Student Name</label>
            <input type="text" id="studentName"
            placeholder="Enter your name">

            <label>Enrollment Number</label>
            <input type="text" id="enrollment"
            placeholder="Enter enrollment number">

            <label>Email Address</label>
            <input type="email" id="email"
            placeholder="Enter email">

            <label>Student Category</label>
            <select id="category" onchange="showPaymentOptions()">
                <option value="">Select Category</option>
                <option value="Hosteller">Hosteller</option>
                <option value="Day Scholar">Day Scholar</option>
            </select>

            <div id="hostellerOptions" style="display:none;">
                <label>Mess Plan</label>
                <select id="messPlan">
                    <option value="3400">Vegetarian - ₹3400/month</option>
                    <option value="3800">Non-Vegetarian - ₹3800/month</option>
                </select>
            </div>


<div id="dayScholarOptions" style="display:none;">

    <h3>Day Scholar Wallet</h3>

    <p>Breakfast: ₹50</p>
    <p>Lunch: ₹70</p>
    <p>Dinner: ₹70</p>

    <label>Initial Wallet Recharge</label>
    <input type="number" id="initialRecharge"
    placeholder="Enter amount to add">

</div>


            <button type="button" onclick="registerStudent()">
                Register
            </button>
        </form>

        <div id="walletSection" style="display:none; margin-top:30px;">

            <h2>My Meal Wallet</h2>

            <h3>Breakfast Balance: ₹<span id="breakfastBalance">0</span></h3>
            <h3>Lunch Balance: ₹<span id="lunchBalance">0</span></h3>
            <h3>Dinner Balance: ₹<span id="dinnerBalance">0</span></h3>

            <label>Select Wallet to Recharge</label>
            <select id="walletMeal">
                <option value="breakfast">Breakfast</option>
                <option value="lunch">Lunch</option>
                <option value="dinner">Dinner</option>
            </select>

            <label>Recharge Amount</label>
            <input type="number" id="rechargeAmount"
            placeholder="Enter amount">

            <button type="button" onclick="addMoney()">
                Add Money
            </button>

            <h3>Transaction History</h3>
            <ul id="transactionHistory"></ul>

        </div>

    </section>

    <script src="script.js"></script>
</body>
</html>
