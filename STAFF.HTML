<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff - MESSCARD</title>
    <link rel="stylesheet" href="../CSS/STYLE.CSS">
</head>
<body>

<header>
    <h1>MESSCARD</h1>

    <nav>
        <a href="../INDEX.HTML">Home</a>
        <a href="STAFF.HTML">Staff</a>
        <a href="STAFF-DASHBOARD.HTML">Staff Dashboard</a>
        <a href="VERIFICATION.HTML">Meal Verification</a>
        <a href="ADMIN.HTML">Admin Login</a>
    </nav>
</header>

<section>
    <h2>Staff Meal Portal</h2>
    <p>Generate one common meal QR code for all students.</p>

    <div class="dash-card">

        <h3>Select Meal</h3>

        <select id="staffMeal">
            <option value="">Select Meal</option>
            <option value="Breakfast">Breakfast</option>
            <option value="Lunch">Lunch</option>
            <option value="Dinner">Dinner</option>
        </select>

        <button onclick="generateStaffQR()">
            Generate Meal QR
        </button>

        <div id="staffQR"></div>

        <p id="staffMessage"></p>

        <p>
            All students can use the same QR code
            displayed by the staff.
        </p>

    </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../JS/SCRIPT.JS"></script>

</body>
</html>
