<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MESSCARD</title>
    <link rel="stylesheet" href="../CSS/STYLE.CSS">
</head>
<body>

<header>
    <h1>MESSCARD</h1>
    <nav>
        <a href="../INDEX.HTML">Home</a>
        <a href="ADMIN.HTML">Admin Login</a>
        <a href="DASHBOARD.HTML">Dashboard</a>
        <a href="STAFF-DASHBOARD.HTML">Staff Dashboard</a>
    </nav>
</header>

<section>
    <h2>Admin Dashboard</h2>
    <p>Manage registered students and mess details.</p>

    <div class="dashboard-cards">

        <div class="dash-card">
            <h3>Total Students</h3>
            <h2 id="totalStudents">0</h2>
        </div>

        <div class="dash-card">
            <h3>Veg Students</h3>
            <h2 id="vegStudents">0</h2>
        </div>

        <div class="dash-card">
            <h3>Non-Veg Students</h3>
            <h2 id="nonVegStudents">0</h2>
        </div>

    </div>

    <h3>Registered Students</h3>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Enrollment Number</th>
                <th>Student Type</th>
                <th>Mess Plan</th>
            </tr>
        </thead>

        <tbody id="studentTable">
            <tr>
                <td colspan="4">No students registered yet.</td>
            </tr>
        </tbody>
    </table>

</section>

<script src="../JS/SCRIPT.JS"></script>

</body>
</html>
