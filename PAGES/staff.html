<!DOCTYPE html>

<head>

<header>

        <a href="registration.html">Student Registration</a>
        <a href="staff.html">Staff Login</a>

    </nav>

<section>
    <h2>Staff Login</h2>
    <p>Login to generate meal QR codes and view meal records.</p>

    <div class="dash-card">
        <form onsubmit="staffLogin(); return false;">

            <label>Staff ID</label>
            <input type="text" id="staffId" placeholder="Enter Staff ID" required>

            <label>Password</label>
            <input type="password" id="staffPassword" placeholder="Enter Password" required>

            <button type="submit">Login</button>

        </form>
    </div>
</section>

<script src="../JS/SCRIPT.JS"></script>

</body>
