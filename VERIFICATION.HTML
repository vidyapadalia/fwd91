<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Verification - MESSCARD</title>
    <link rel="stylesheet" href="../CSS/STYLE.CSS">
</head>
<body>

<header>
    <h1>MESSCARD</h1>

    <nav>
        <a href="../INDEX.HTML">Home</a>
        <a href="STAFF.HTML">Staff QR</a>
        <a href="STAFF-DASHBOARD.HTML">Staff Dashboard</a>
        <a href="VERIFICATION.HTML">Meal Verification</a>
        <a href="ADMIN.HTML">Admin Login</a>
    </nav>
</header>

<section>
    <h2>Student Meal Verification</h2>

    <p>
        Scan the common QR code displayed by staff
        and enter your enrollment number.
    </p>

    <div class="dash-card">

        <h3>Scan Staff Meal QR</h3>

        <div id="qrReader"
             style="width:100%; max-width:350px; margin:15px auto;">
        </div>

        <button onclick="startMealScanner()">
            Start Camera Scan
        </button>

        <p id="verificationMessage">
            Scan the staff QR to begin.
        </p>

        <label for="verifyEnrollment">
            Enrollment Number
        </label>

        <input type="text"
               id="verifyEnrollment"
               placeholder="Enter your enrollment number">

        <label for="verifyMeal">
            Scanned Meal
        </label>

        <select id="verifyMeal" disabled>
            <option value="">Scan QR first</option>
            <option value="Breakfast">Breakfast</option>
            <option value="Lunch">Lunch</option>
            <option value="Dinner">Dinner</option>
        </select>

        <button onclick="verifyMeal()">
            Verify Meal
        </button>

    </div>
</section>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="../JS/SCRIPT.JS"></script>

</body>
</html>
